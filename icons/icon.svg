<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />
  
  <!-- Outer vault ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="14" filter="url(#glow)" opacity="0.9" />
  
  <!-- 4 Vault notches -->
  <circle cx="256" cy="116" r="8" fill="#38bdf8" />
  <circle cx="256" cy="396" r="8" fill="#818cf8" />
  <circle cx="116" cy="256" r="8" fill="#6366f1" />
  <circle cx="396" cy="256" r="8" fill="#38bdf8" />

  <!-- Inner Vault Play Badge -->
  <path d="M224 196 L332 256 L224 316 Z" fill="url(#accentGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
</svg>
